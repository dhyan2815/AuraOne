name: AuraOne Preflight Checks

on:
  pull_request:
    branches: [main]
  push:

jobs:
  preflights:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      
      - run: npx tsc --noEmit
      
      - run: npm run lint
      
      - run: npm run test:run -- --coverage
      
      - run: npm run build
      
      - run: npm audit --audit-level=moderate
        continue-on-error: true