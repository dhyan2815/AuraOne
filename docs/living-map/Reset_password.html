<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>AuraOne · Reset password</title>


</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
.wrapc{min-height:900px;display:grid;place-items:center;padding:40px 20px;position:relative;overflow:hidden}
.blob{position:absolute;right:-140px;bottom:-180px;width:820px;height:640px;background:var(--know);border-radius:56% 44% 40% 60%/50% 58% 42% 50%}
.card{position:relative;background:var(--sheet);border-radius:36px;padding:44px 48px;width:min(520px,100%);display:grid;gap:16px}
.card h1{font-size:48px;font-weight:800;letter-spacing:-.05em;font-stretch:72%;line-height:.95}
.err{color:var(--alert);font-weight:650;font-size:15px}
.bad{box-shadow:0 0 0 3px var(--alert)}
.mk{position:absolute;left:32px;top:24px}
</style>
</helmet>
<div class="lm" data-theme="{{theme}}">
<div class="wrapc"><div class="blob" aria-hidden="true"></div><a class="mark mk" href="Main.dc.html">AuraOne</a>
<form class="card" onsubmit="return false" aria-label="Choose a new password">
<h1>Choose a new password</h1>
<p>At least 8 characters. You'll be signed in right after.</p>
<label class="field" style="--c:var(--know)">New password<input class="input" type="password" value="newsecret22"></label>
<label class="field" style="--c:var(--know)">Confirm new password<input class="input bad" type="password" value="newsecret2" aria-invalid="true" aria-describedby="m"></label>
<p class="err" id="m" role="alert">Passwords don't match yet.</p>
<button class="btn" type="submit" style="justify-content:center;padding:15px">Update password</button>
<a href="Login.dc.html" style="font-weight:650;text-decoration:underline">Back to log in</a>
</form></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals(){ return { theme: this.props.dark ? 'dark' : 'light' }; }
}
</script>


</body></html>
