<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>AuraOne · Forgot password</title>


</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
.wrapc{min-height:900px;display:grid;place-items:center;padding:40px 20px;position:relative;overflow:hidden}
.blob{position:absolute;left:-120px;top:-160px;width:760px;height:620px;background:var(--events);border-radius:44% 56% 60% 40%/50% 42% 58% 50%}
.card{position:relative;background:var(--sheet);border-radius:36px;padding:44px 48px;width:min(520px,100%);display:grid;gap:16px}
.card h1{font-size:48px;font-weight:800;letter-spacing:-.05em;font-stretch:72%;line-height:.95}
.sent{background:var(--today);color:#1F211E;border-radius:20px;padding:14px 18px;font-weight:600}
.mk{position:absolute;left:32px;top:24px}
</style>
</helmet>
<div class="lm" data-theme="{{theme}}">
<div class="wrapc"><div class="blob" aria-hidden="true"></div><a class="mark mk" href="Main.dc.html" style="color:#1F211E">AuraOne</a>
<form class="card" onsubmit="return false" aria-label="Reset your password">
<h1>Forgot your password?</h1>
<p>Enter your account email and we'll send a link to choose a new one.</p>
<label class="field" style="--c:var(--events)">Email<input class="input" type="email" value="dhyan@example.com"></label>
<button class="btn" type="submit" style="justify-content:center;padding:15px">Send reset link</button>
<sc-if value="{{sent}}" hint-placeholder-val="{{true}}"><p class="sent" role="status">Link sent to dhyan@example.com. It expires in 1 hour.</p></sc-if>
<a href="Login.dc.html" style="font-weight:650;text-decoration:underline">Back to log in</a>
</form></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;sent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals(){ return { theme: this.props.dark ? 'dark' : 'light', sent: this.props.sent ?? true }; }
}
</script>


</body></html>
