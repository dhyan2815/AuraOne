<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>AuraOne · Phone Aura</title>


</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pl{background:var(--aura);color:#1F211E;margin-left:-40px;padding:18px 24px 34px 56px;border-radius:0 62% 48% 0/0 60% 58% 0;width:92%}
.pl h1{font-size:46px;font-weight:800;letter-spacing:-.055em;line-height:.9;font-stretch:72%}
.chat{flex:1;padding:12px 14px 0;display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 16px;border-radius:22px;background:var(--sheet);font-size:15px;max-width:88%}
.me{align-self:flex-end;background:#1F211E;color:#fff}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--aura);color:#1F211E}
.comp{margin:10px 12px 14px;display:flex;gap:6px;background:var(--sheet);border-radius:999px;padding:5px;align-items:center}
.comp input{flex:1;border:0;background:none;padding:10px 12px;outline:none;font-size:15px}
</style>
</helmet>
<div class="lm" data-theme="{{theme}}">
<div class="ph">
<div class="bar" style="padding:14px 16px"><a href="PhoneToday.dc.html" style="font-weight:650">‹ Today</a><div class="seg end" style="--c:var(--aura)"><button class="on">Command</button><button>Brain</button></div></div>
<section class="pl"><h1>Aura</h1><p style="font-size:14px;margin-top:6px">Plan my Saturday</p></section>
<div class="chat">
<div class="msg me">push my review by half an hour</div>
<div class="steps"><span>read_events</span><span>update_event · 10:30</span></div>
<div class="msg">Done. Portfolio review now starts at 10:30.</div>
<div class="msg me">and remind me about groceries</div>
<div class="steps"><span>create_task · Buy groceries</span></div>
<div class="msg">Added to tomorrow's list, Medium priority.</div>
</div>
<form class="comp" onsubmit="return false"><input placeholder="Ask Aura…" aria-label="Message Aura"><button class="btn" style="padding:10px 16px">Send</button></form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals(){ return { theme: this.props.dark ? 'dark' : 'light' }; }
}
</script>


</body></html>
